# CI/CD Pipeline — KeepUnB
# Executa lint + testes em todo PR para developer.

name: CI

on:
  pull_request:
    branches: [developer]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Format with Black
        working-directory: ./backend
        run: black --check .
      - name: Lint with Ruff
        working-directory: ./backend
        run: ruff check .
      - name: Test with pytest
        working-directory: ./backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: ./frontend
        run: npm install
      - name: Lint with ESLint
        working-directory: ./frontend
        run: npm run lint
