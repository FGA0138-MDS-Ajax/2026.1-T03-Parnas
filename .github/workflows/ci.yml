# CI/CD Pipeline — KeepUnB
# Executa lint + testes em todo PR para developer.

name: CI

on:
  pull_request:
    branches: [developer]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: keepunb
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: keepunb_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt
      - name: Test with pytest
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://keepunb:changeme@localhost:5432/keepunb_dev
          SECRET_KEY: changeme-secret-key
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: ./frontend
        run: npm install
      - name: Lint with ESLint
        working-directory: ./frontend
        run: npm run lint
