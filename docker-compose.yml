# docker-compose.yml — KeepUnB
# Orquestração dos serviços: backend, frontend e banco de dados.

services:
  db:
    image: postgres:16
    container_name: keepunb-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data

  db_test:
    image: postgres:16
    container_name: keepunb-db-test
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: keepunb
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: keepunb_test
    volumes:
      - pgdata_test:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: keepunb-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - db
      - db_test
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: keepunb-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
  pgdata_test:
