# alembic.ini — Configuração do Alembic
# Veja: https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
script_location = migrations
#sqlalchemy.url = postgresql+asyncpg://keepunb:changeme@db:5432/keepunb_dev
sqlalchemy.url = postgresql+asyncpg://keepunb:changeme@localhost:5432/keepunb_dev

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
