site_name: KeepUnB
site_description: Documentação oficial do projeto KeepUnB
site_author: Equipe KeepUnB

theme:
  name: material
  language: pt-BR
  logo: assets/logokeepunb.png
  favicon: assets/favicon.png

  font:
    text: DM Sans
    code: JetBrains Mono

  palette:
    scheme: default
    primary: custom
    accent: custom

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow

nav:
  - Início: "index.md"

  - Como executar:
      - Primeiros passos: "como-executar/tutorial.md"

  - Documentação:
      - Documento de Visão: "visao/visao.md"
      - Documento de Arquitetura: "arq/arq.md"
      - Comunicação, API e autenticação: "comunicacao/api-e-autenticacao.md"
      - Identidade Visual: "identidade_visual/identidade_visual.md"
      - Padronização: "Padronizacao/Politica_branches_commits.md"
      - Sobre o banco de dados: "banco-de-dados/diagrama-relacionamento-inicial.md"


  - Sprints:
      - Sprint 0: "sprint0/sprint0.md"
      - Sprint 1: "sprint1/sprint1.md"
      - Sprint 2: "sprint2/sprint2.md"
      - Sprint 3: "sprint3/sprint3.md"
      - Sprint 4: "sprint4/sprint4.md"
      - Sprint 5: "sprint5/sprint5.md"

  - Nossa equipe:
      - Membros: "equipe/membros.md"


markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css
